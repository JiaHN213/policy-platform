# Local integration environment. Bind only Nginx to loopback; no database ports exposed.
name: policy-platform
x-api: &api
  build:
    context: .
    dockerfile: infra/api.Dockerfile
  env_file: ${APP_ENV_FILE:-.env.compose}
  environment: &api-env
    DEBUG: ${DEBUG:-true}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost},api,web,nginx
    DATABASE_URL: postgresql://policy_app:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/policy_app
    CHECKPOINT_DATABASE_URL: postgresql://policy_app:${POSTGRES_PASSWORD}@postgres:5432/policy_app?options=-csearch_path%3Dlanggraph
    REDIS_URL: redis://redis:6379/0
    LOCAL_WORKER: "false"
    OPENSEARCH_URL: http://opensearch:9200
    OPENSEARCH_ENABLED: ${OPENSEARCH_ENABLED:-false}
    S3_ENDPOINT: http://minio:9000
    ORIGINAL_STORAGE_BACKEND: ${ORIGINAL_STORAGE_BACKEND:-local}
    KNOWLEDGE_LLM_ENABLED: ${KNOWLEDGE_LLM_ENABLED:-true}
    KNOWLEDGE_RELATION_AUDIT_ENABLED: ${KNOWLEDGE_RELATION_AUDIT_ENABLED:-true}
    KNOWLEDGE_RELATION_SCANS_PER_BUILD: ${KNOWLEDGE_RELATION_SCANS_PER_BUILD:-25}
    OBSIDIAN_EXPORT_ENABLED: ${OBSIDIAN_EXPORT_ENABLED:-true}
    OBSIDIAN_EXPORT_DIR: /app/output/obsidian-vault
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: policy_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: policy_app
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policy_app -d policy_app"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
  backup:
    image: postgres:17.11
    profiles: [backup]
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: policy_app
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PGDATABASE: policy_app
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    command: ["sh", "/usr/local/bin/backup-loop.sh"]
    volumes:
      - ./infra/backup-loop.sh:/usr/local/bin/backup-loop.sh:ro
      - ./.local/backups/docker-auto:/backups
    depends_on:
      postgres:
        condition: service_healthy
  init:
    <<: *api
    command: ["sh", "-c", "python apps/api/manage.py migrate --noinput && python apps/api/manage.py setup_checkpoints && python apps/api/manage.py bootstrap && python apps/api/manage.py collectstatic --noinput"]
    volumes: ["staticfiles:/app/staticfiles"]
  api:
    <<: *api
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - staticfiles:/app/staticfiles:ro
      - ./.local/originals:/app/.local/originals
      - ./output/obsidian-vault:/app/output/obsidian-vault
  worker:
    <<: *api
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - ./.local/originals:/app/.local/originals
      - ./output/obsidian-vault:/app/output/obsidian-vault
  beat:
    <<: *api
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      init:
        condition: service_completed_successfully
  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
  nginx:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/staticfiles:ro
    depends_on: [api, web]
  opensearch:
    image: opensearchproject/opensearch:3.8.0
    profiles: [search]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["127.0.0.1:9200:9200"]
    volumes: ["search-data:/usr/share/opensearch/data"]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: [storage]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
    volumes: ["originals:/data"]

volumes:
  postgres-data:
  redis-data:
  staticfiles:
  search-data:
