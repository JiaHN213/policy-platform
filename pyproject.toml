[project]
name = "policy-platform"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "django>=5.2.8,<5.3",
  "djangorestframework>=3.16,<4",
  "drf-spectacular>=0.28,<1",
  "django-environ>=0.12,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "celery[redis]>=5.5,<6",
  "langgraph>=1,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.13,<5",
  "opensearch-py>=3,<4",
  "boto3>=1.36,<2",
  "pypdf>=6.18.1,<7",
  "pyyaml>=6,<7",
  "gunicorn>=23,<24; sys_platform != 'win32'",
  "xlrd>=2.0.2,<3",
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-django>=4.9,<5", "ruff>=0.12"]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
pythonpath = ["apps/api"]
testpaths = ["tests"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
