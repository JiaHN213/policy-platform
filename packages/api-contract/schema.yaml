        * `rejected` - 核验不通过
    ViewEnum:
      enum:
      - policy
      - opportunity
      type: string
      description: |-
        * `policy` - policy
        * `opportunity` - opportunity
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
