components:
  schemas:
    AIModelProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        purpose:
          allOf:
          - $ref: '#/components/schemas/PurposeEnum'
          readOnly: true
        purpose_label:
          type: string
          readOnly: true
        enabled:
          type: boolean
        base_url:
          type: string
          format: uri
          maxLength: 500
        model:
          type: string
          maxLength: 200
        concurrency:
          type: integer
          maximum: 4
          minimum: 1
        has_api_key:
          type: boolean
          readOnly: true
        configured:
          type: boolean
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - base_url
      - configured
      - has_api_key
      - id
      - model
      - purpose
      - purpose_label
      - updated_at
    Attachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        url:
          type: string
          format: uri
          maxLength: 2000
        content_type:
          type: string
          maxLength: 100
        size_bytes:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        parse_status:
          type: string
          maxLength: 30
      required:
      - content_type
      - id
      - size_bytes
      - url
    Batch:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        opportunity:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        status:
          $ref: '#/components/schemas/OpportunityStatusEnum'
        starts_at:
          type: string
          format: date-time
          nullable: true
        deadline_at:
          type: string
          format: date-time
          nullable: true
        current_status:
          type: string
          readOnly: true
        closing_soon:
          type: boolean
